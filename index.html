<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="./css/style.css">
  <title>Frontend Mentor | Product preview card component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700&family=Montserrat:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
<main>
  <div class="card">
    <div class="photo">
      <picture>
        <source
        media="(max-width: 768px)"
        srcset="./images/image-product-mobile.jpg"
        >
      <img src="./images/image-product-desktop.jpg" alt="photo of channel perfume">
      </picture>
    </div>
    <div class="details">
  <p class="title">Perfume</p>

  <h1>Gabrielle Essence Eau De Parfum </h1>

  <p>A floral, solar and voluptuous interpretation composed by Olivier Polge, 
  Perfumer-Creator for the House of CHANEL.</p>

  <div class="price">
    <span class="current">$149.99</span>
    <span class="old">$169.99</span>
  </div>

  <button>
    <img src="./images/icon-cart.svg" alt="cart icon">
    Add to Cart
  </button>
    </div>
  <!-- <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">shimaa mostafa</a>.
  </footer> -->
  </div>
</main>
</body>
</html>
